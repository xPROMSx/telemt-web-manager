name: checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  safety:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install test tools
        run: sudo apt-get update && sudo apt-get install -y shellcheck jq nginx libnginx-mod-stream iptables nftables conntrack certbot passwd iproute2 util-linux curl python3 openssl ca-certificates
      - name: Telemt conntrack dependency and default systemd runtime PATH
        run: |
          command -v conntrack
          systemd-path search-binaries-default
          env -i PATH="$(systemd-path search-binaries-default)" conntrack --version
          evidence="$RUNNER_TEMP/telemt-pinned-evidence"
          mkdir -m 0700 "$evidence"
          printf 'TELEMT_TEST_EVIDENCE_DIR=%s\n' "$evidence" >> "$GITHUB_ENV"
      - name: Bash syntax
        run: for file in install.sh telemt-web-manager.sh tests/*.sh; do bash -n "$file"; done
      - name: ShellCheck
        run: shellcheck -x install.sh telemt-web-manager.sh tests/*.sh
      - name: Parser/unit and fresh transaction fixtures (service/path/journal transport mocked)
        run: bash tests/run.sh && bash tests/fresh.sh && bash tests/fresh-rollback.sh && bash tests/download.sh && bash tests/bootstrap_versions.sh && bash tests/preflight.sh
      - name: Private WEB link identity, read-only menu and committed Install display (real root/PTY; lifecycle mocked)
        run: sudo python3 tests/web_link_fixture.py
      - name: Real fresh account and owned runtime-state rollback (temporary root-owned fixtures)
        run: sudo bash tests/fresh-account.sh
      - name: Pinned Telemt 3.5.12 release provenance and real config healthcheck (no runtime)
        run: bash tests/pinned.sh && bash tests/upstream.sh
      - name: Pinned Telemt 3.5.12 staging healthcheck (service/path health mocked)
        run: bash tests/staging.sh
      - name: Real Telemt 3.5.12 runtime smoke in isolated network namespace (no systemd)
        run: sudo env TELEMT_TEST_EVIDENCE_DIR="$TELEMT_TEST_EVIDENCE_DIR" bash tests/runtime.sh
      - name: Production pin equals real downloaded, staging, runtime and documented version
        run: bash tests/pinned.sh --versions
      - name: Manager bootstrap release selection, atomic pair update and rollback (temporary root-owned fixtures)
        run: sudo bash tests/bootstrap.sh
      - name: Managed uninstall, certificate reuse/delete and transaction rollback (private local fixtures)
        run: sudo bash tests/uninstall.sh
      - name: Pinned upgrade/newer-version refusal and rollback fixtures (synthetic binary/lifecycle)
        run: bash tests/versions.sh
      - name: Real nf_tables diagnostic in namespace (synthetic log bridge; no Telemt runtime)
        run: bash tests/conntrack.sh
      - name: Writable state and systemd contract
        run: bash tests/contracts.sh
      - name: Shared check lock and exclusive mutation races
        run: bash tests/locks.sh
      - name: Certbot and Nginx webroot transactions
        run: bash tests/acme.sh
      - name: Renewal socket, deploy hook and scheduler contracts (temporary root-owned fixtures)
        run: sudo bash tests/renewal.sh
      - name: Real Nginx stream and TLS fixture
        run: bash tests/nginx.sh
      - name: Current reviewed 3x-ui-pro installer and patcher topologies
        run: bash tests/three-x-ui.sh
